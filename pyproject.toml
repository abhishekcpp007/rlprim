[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rlprim"
version = "0.1.0"
description = "Fast building blocks for RL training loops: GAE, n-step returns, prioritized replay sampling. C++ core, NumPy API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["reinforcement-learning", "gae", "prioritized-replay", "sum-tree", "numpy"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/abhishekcpp007/rlprim"
Issues = "https://github.com/abhishekcpp007/rlprim/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
wheel.packages = ["python/rlprim"]
cmake.build-type = "Release"
sdist.include = ["include", "src", "python", "CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = "pytest"
test-command = "pytest {project}/tests"
